[project]
name = "iquana-ai-service"
version = "0.1.0"
description = "Unified IQUANA AI service: one host for prompted segmentation, instance suggestion and full instance segmentation, with model-centric registration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- shared service plumbing ---
    "iquana-toolbox",
    "fastapi[standard]>=0.122.0",
    "celery>=5.6.2",
    "celery-types>=0.26.0",
    "redis>=4.5.0",
    "flower>=2.0.0",
    "mlflow>=2.10.0",
    # --- ML core (union of the three former services) ---
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "transformers>=4.56.0",  # DINOv3 support landed in 4.56
    "accelerate",
    "timm>=0.9.0",
    "huggingface-hub>=1.3.0",
    "einops>=0.8.2",
    "numpy>=2.3.3",
    "opencv-python>=4.11.0.86",
    "pillow>=10.0.0",
    "scikit-image>=0.26.0",
    "scikit-learn",
    "scipy>=1.11.0",  # Hungarian matching in the DINOv3 set loss
    "scipy-stubs",
    "pycocotools",
    # --- instance-suggestion extras (GeCo + hydra config stack) ---
    "geco",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "py3-wget>=1.0.13",
    "plotly",
    "pydantic",
    "requests>=2.31.0",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "ipykernel>=7.3.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
geco = { git = "https://github.com/robertleist/GeCo.git" }
# toolbox is the one remaining shared IQUANA package (it is also used by the
# backend, which is why it stays torch-free). It is now the only consumer-side
# pin, so a local path source is free to use when toolbox needs local edits:
# iquana-toolbox = { path = "../iquana-toolbox", editable = true }
iquana-toolbox = { git = "https://github.com/Iquana-tool/iquana-toolbox.git", rev = "425a08aaed1f23a7f98aa0680eb7ae2d7af40a21" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
